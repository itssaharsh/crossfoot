[project]
name = "crossfoot"
version = "0.1.0"
description = "Audits published data against the scanned documents it was copied from, using the documents' own printed totals."
requires-python = ">=3.12"
dependencies = ["pillow"]

[project.scripts]
crossfoot = "crossfoot.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crossfoot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
